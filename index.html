/* ---------- maths ---------- */
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const EASE={ linear:t=>t, in:t=>t*t, out:t=>1-(1-t)*(1-t), inout:t=>t*t*(3-2*t),
  back:t=>{const k=1.70158;t=t-1;return 1+t*t*((k+1)*t+k);}, bounce:t=>{const n=7.5625,d=2.75;
  if(t<1/d)return n*t*t; if(t<2/d)return n*(t-=1.5/d)*t+.75; if(t<2.5/d)return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375;} };
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const rr=(a,b)=>a+(b-a)*rnd();

/* ---------- story clock (ms). Everything waits on this clock so ?speed works ---------- */
let clock=0, lastNow=performance.now(), waiters=[], tweens=[];
const sec=()=>clock/1000;
function sleep(ms){ return new Promise(r=>waiters.push({at:clock+ms, r})); }
function until(ms){ return new Promise(r=>waiters.push({at:ms, r})); }
function tween(o, props, ms, ease="inout"){
  return new Promise(r=>{ const from={}; for(const k in props) from[k]=o[k];
    tweens=tweens.filter(tw=>!(tw.o===o && Object.keys(props).some(k=>k in tw.props)));
    tweens.push({o, from, props, t0:clock, ms:Math.max(1,ms), ease:EASE[ease]||EASE.inout, r}); });
}
function stepClock(){
  const now=performance.now(); let dt=Math.min(100,now-lastNow)*SPEED; lastNow=now;
  if(playing) clock+=dt;
  tweens=tweens.filter(tw=>{ const p=clamp((clock-tw.t0)/tw.ms), e=tw.ease(p);
    for(const k in tw.props) tw.o[k]=lerp(tw.from[k], tw.props[k], e);
    if(p>=1){ tw.r(); return false; } return true; });
  waiters=waiters.filter(w=>{ if(clock>=w.at){ w.r(); return false; } return true; });
}

let AC, MASTER, MUSIC, SFXG, REC_DEST;
function ac(){
  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=.9; MASTER.connect(AC.destination);
    MUSIC=AC.createGain(); MUSIC.gain.value=0; MUSIC.connect(MASTER);
    SFXG=AC.createGain(); SFXG.gain.value=.8; SFXG.connect(MASTER); }
  return AC;
}

function tone(f1,f2,d,type="sine",v=.2,delay=0,dest){
  try{ const c=ac(), t=c.currentTime+delay/SPEED, o=c.createOscillator(), gn=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(v,t+Math.min(.02,d/4)); gn.gain.exponentialRampToValueAtTime(.0005,t+d);
    o.connect(gn).connect(dest||SFXG); o.start(t); o.stop(t+d+.05); }catch(e){}
}
function noise(d,v=.3,f=1000,delay=0,type="lowpass",f2,dest){
  try{ const c=ac(), t=c.currentTime+delay/SPEED, n=Math.floor(c.sampleRate*d), b=c.createBuffer(1,n,c.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t);
    if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    const gn=c.createGain(); gn.gain.setValueAtTime(.0001,t); gn.gain.linearRampToValueAtTime(v,t+Math.min(.05,d/3)); gn.gain.exponentialRampToValueAtTime(.0005,t+d);
    s.connect(fl).connect(gn).connect(dest||SFXG); s.start(t); }catch(e){}
}

function vScore(v){ if(ROBOT.test(v.name)) return -10;
  if(/natural|online|neural/i.test(v.name)) return 6; if(/premium|enhanced|siri/i.test(v.name)) return 5;
  if(/google/i.test(v.name)) return 3; if(/samantha|karen|daniel|moira|serena|tessa|alex|ava|evan|zoe/i.test(v.name)) return 2;

let SAVED={}; try{ SAVED=JSON.parse(localStorage.getItem("sj_voices")||"{}"); }catch(e){}
function castVoices(){
  VMAP={}; if(!VOICES.length){ $("voiceInfo").textContent = typeof AUDIO!=="undefined"&&Object.keys(AUDIO).length? "Natural voices built in ✓":""; return; }
  const ok=VOICES.filter(v=>vScore(v)>=0).sort((a,b)=>vScore(b)-vScore(a));
  const used=new Set();
  const order=["narrator","sci1","sci2","sci3","spark","moony","marsy","astro","sib1","sib2","sib3","craft","craft1","craft2","craft3"];
  for(const k of order){ const c=CAST[k];
    const saved=SAVED[k]&&VOICES.find(v=>v.name===SAVED[k]); if(saved){ VMAP[k]=saved; used.add(saved.name); continue; }
    let v=null;
    for(const re of c.prefer){ v=ok.find(x=>re.test(x.name)&&!used.has(x.name)); if(v) break; }
    const sameG=ok.filter(x=>(c.g==="f")===FEMALE.test(x.name));
    if(!v) v=sameG.find(x=>!used.has(x.name)) || sameG[0] || ok[0] || VOICES[0];
    VMAP[k]=v; if(v) used.add(v.name); }

  $("voiceInfo").textContent = (typeof AUDIO!=="undefined"&&Object.keys(AUDIO).length) ? "Natural voices built in ✓" :
     nat ? "Natural voices ✓  Narrator: "+(VMAP.narrator?VMAP.narrator.name.replace(/Microsoft |Online |\(Natural\)| - .*$/g,""):"") : "Tip: open in Microsoft Edge for the most natural voices";
}
/* the 🎙 Voices panel: choose any installed voice for each character */

    const row=document.createElement("div"); row.className="vrow";

/* natural voices sound most human at their own pitch, so pitch changes are kept small for them */

const AU={};

function speak(l){
  const text=l.say||l.text, who=CAST[l.who].voiceOf||l.who, c=CAST[who];
  if(!$("voiceChk").checked) return {p:Promise.resolve(), dur:estimate(text)};
  const cl=clipFor(l.id,l);
  if(cl){ const au=cl.au; try{ au.pause(); au.currentTime=0; }catch(e){}
    au.playbackRate=Math.min(4,SPEED);
    const p=new Promise(res=>{ let done=false; const fin=()=>{ if(!done){done=true;res();} };
      au.onended=fin; au.play().catch(fin); setTimeout(fin, cl.dur*1000/SPEED+1500); });
    return {p, dur:cl.dur}; }
  if(window.speechSynthesis && VOICES.length && SPEED<=1.5){
    const u=new SpeechSynthesisUtterance(text); const v=VMAP[who]; if(v) u.voice=v;
    u.pitch=voicePitch(who); u.rate=voiceRate(who); if(v){ u.voice=v; u.lang=v.lang; } console.log("voice",who,v&&v.name);
    const p=new Promise(res=>{ let done=false; const fin=()=>{ if(!done){done=true;res();} };
      u.onend=fin; u.onerror=fin; setTimeout(fin, estimate(text)*2500+3000); });

let sceneStart=0;
async function beginScene(n){ sceneStart=clock; window.__scene=n; console.log("scene",n,"at",(clock/1000).toFixed(1)); }
/* scene change: a 2.4 s animated card (iris wipe + next scene's title), never a long black screen */
const TRANS_MS=2400;
async function endScene(n){
  console.log("content",n,((clock-sceneStart)/1000).toFixed(1));
  if(n>=8){ await until(Math.max(clock+4000, 420000)); return; }      // the end card holds to 7:00
  trans={t0:clock, n:n+1};
  await sleep(TRANS_MS*.68);                                           // next scene is built under the card
}

const SCENES=[scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8];
async function run(from=1){
  $("ui").classList.add("playing"); playing=true; clock=0; try{ ac().resume(); }catch(e){}
  if(from>1){ titleCard.a=0; titleCard.hero=null; fade.a=1; }
  clock = from>1 ? 0 : 0;
  for(let i=from;i<=8;i++){ await SCENES[i-1](); }
  window.__done=true; console.log("episode end at",(clock/1000).toFixed(1));
  playing=false; $("playBtn").textContent="▶ Play again"; $("ui").classList.remove("playing");
  if(REC) REC.stop();
}

/* ---------- recording (canvas + music + effects + built-in voices) ---------- */
let REC=null;
function startRecording(){
  const stream=cv.captureStream(30); try{ REC_DEST=ac().createMediaStreamDestination(); MASTER.connect(REC_DEST); REC_DEST.stream.getAudioTracks().forEach(t=>stream.addTrack(t)); }catch(e){}
  const type=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));
  const chunks=[]; REC=new MediaRecorder(stream,{mimeType:type, videoBitsPerSecond:8e6});
  REC.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  REC.onstop=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"})); a.download="Space_Junk_The_Great_Space_Mess.webm"; a.click(); REC=null; };
  REC.start(1000);
}

  ac(); if(rec) startRecording(); run(+$("sceneSel").value||1); }
